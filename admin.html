<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>لوحة تحكم إدارة المبيعات</title>
  <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --primary: #4a5568;
      --bg: #f5f7fa;
      --surface: #ffffff;
      --border: #e2e8f0;
      --radius: 12px;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Tajawal', sans-serif;
      background: var(--bg);
      color: #2d3748;
      padding: 20px;
    }
    .container {
      max-width: 800px;
      margin: 0 auto;
      background: var(--surface);
      padding: 24px;
      border-radius: var(--radius);
      box-shadow: 0 4px 6px rgba(0,0,0,0.05);
    }
    h1 { font-size: 24px; margin-bottom: 20px; color: var(--primary); border-bottom: 2px solid var(--border); padding-bottom: 10px; }
    h2 { font-size: 18px; margin-bottom: 16px; margin-top: 24px;}
    
    .settings-card {
      background: #edf2f7;
      padding: 16px;
      border-radius: var(--radius);
      margin-bottom: 24px;
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
    }
    .settings-card input {
      padding: 10px;
      border: 1px solid #cbd5e0;
      border-radius: 8px;
      font-family: inherit;
    }
    .settings-card input[type="password"] { grid-column: span 2; }
    
    .rep-card {
      background: var(--surface);
      border: 1px solid var(--border);
      padding: 16px;
      border-radius: var(--radius);
      margin-bottom: 12px;
      display: grid;
      grid-template-columns: 1fr 1fr 1fr;
      gap: 12px;
      align-items: center;
    }
    .rep-card input {
      padding: 8px;
      border: 1px solid var(--border);
      border-radius: 6px;
      font-family: inherit;
    }
    .rep-card .full-row { grid-column: span 3; display: flex; gap: 8px;}
    .btn {
      padding: 10px 16px;
      border: none;
      border-radius: 8px;
      font-family: inherit;
      font-weight: 700;
      cursor: pointer;
      transition: all 0.2s;
    }
    .btn-add { background: #cbd5e1; color: #1e293b; width: 100%; margin-bottom: 24px; }
    .btn-add:hover { background: #94a3b8; }
    .btn-save { background: #25D366; color: white; width: 100%; font-size: 18px; padding: 14px; }
    .btn-save:hover { background: #20bd5a; }
    .btn-delete { background: #fc8181; color: white; padding: 6px 12px; font-size: 12px; }
    
    .status-msg { margin-top: 16px; font-weight: bold; text-align: center; }
    .success { color: #25D366; }
    .error { color: #e53e3e; }
    
    #loading { display: none; text-align: center; margin: 20px; color: var(--primary); }
  </style>
</head>
<body>

  <div class="container">
    <h1>لوحة تحكم فريق المبيعات (تحديث فوري)</h1>
    
    <div class="settings-card">
      <div>
        <label style="display: block; font-size: 13px; font-weight: bold; margin-bottom: 6px; color: var(--primary);">اسم حساب قتهاب (Owner)</label>
        <input type="text" id="ghOwner" placeholder="مثال: silvsquare-eng" value="silvsquare-eng" style="width: 100%;" />
      </div>
      <div>
        <label style="display: block; font-size: 13px; font-weight: bold; margin-bottom: 6px; color: var(--primary);">اسم المستودع (Repository)</label>
        <input type="text" id="ghRepo" placeholder="مثال: qr-page" value="qr-page" style="width: 100%;" />
      </div>
      <div style="grid-column: span 2;">
        <label style="display: block; font-size: 13px; font-weight: bold; margin-bottom: 6px; color: var(--primary);">رمز قتهاب (GitHub Personal Access Token)</label>
        <input type="password" id="ghToken" placeholder="الصق الرمز الذي يبدأ بـ ghp_ هنا" style="width: 100%;" />
      </div>
      <button class="btn" style="grid-column: span 2; background: var(--primary); color: white;" onclick="loadDataFromGithub()">جلب بيانات الموقع الحالية</button>
    </div>

    <div id="loading">جاري التحميل... الرجاء الانتظار</div>

    <div id="meta-settings" style="display: none; background: #e2e8f0; padding: 16px; border-radius: 12px; margin-bottom: 24px;">
      <h3 style="font-size: 14px; margin-bottom: 8px;">إعدادات ميتا بكسل (Meta Pixel ID)</h3>
      <input type="text" id="metaPixelId" style="width: 100%; padding: 10px; border: 1px solid #cbd5e0; border-radius: 8px; font-family: inherit;" placeholder="أدخل رقم الـ Pixel هنا">
    </div>

    <div id="reps-container">
      <!-- Cards will be generated here -->
    </div>

    <button id="btnAdd" class="btn btn-add" style="display: none;" onclick="addRep()">+ إضافة مندوب جديد</button>
    
    <button id="btnSave" class="btn btn-save" style="display: none;" onclick="saveToGithub()">حفظ ونشر التعديلات فوراً</button>

    <div id="status" class="status-msg"></div>
  </div>

  <script>
    let currentTeam = [];
    let currentPixelId = "";
    let fileSha = "";
    let fileContent = "";

    // استرجاع الإعدادات المحفوظة
    document.getElementById('ghOwner').value = localStorage.getItem('ghOwner') || 'silvsquare-eng';
    document.getElementById('ghRepo').value = localStorage.getItem('ghRepo') || 'qr-page';
    document.getElementById('ghToken').value = localStorage.getItem('ghToken') || '';

    function showStatus(msg, isError = false) {
      const statusEl = document.getElementById('status');
      statusEl.textContent = msg;
      statusEl.className = 'status-msg ' + (isError ? 'error' : 'success');
    }

    async function loadDataFromGithub() {
      const owner = document.getElementById('ghOwner').value.trim();
      const repo = document.getElementById('ghRepo').value.trim();
      const token = document.getElementById('ghToken').value.trim();

      if (!owner || !repo || !token) {
        showStatus('الرجاء إدخال رمز قتهاب (Token) والتأكد من تعبئة جميع الحقول', true);
        return;
      }

      localStorage.setItem('ghOwner', owner);
      localStorage.setItem('ghRepo', repo);
      localStorage.setItem('ghToken', token);

      document.getElementById('loading').style.display = 'block';
      showStatus('');

      try {
        const response = await fetch(`https://api.github.com/repos/${owner}/${repo}/contents/index.html`, {
          headers: { 
            'Authorization': `token ${token}`,
            'Accept': 'application/vnd.github.v3+json'
          }
        });

        if (!response.ok) {
          if (response.status === 404) {
            throw new Error(`المستودع "${repo}" غير موجود في حساب "${owner}". تأكد من كتابة qr-page`);
          } else if (response.status === 401) {
            throw new Error('رمز قتهاب (Token) غير صالح أو انتهت صلاحيته.');
          } else if (response.status === 403) {
            throw new Error('الرمز لا يملك صلاحية الوصول إلى repo. تأكد من تفعيل خيار repo عند إنشاء Token.');
          } else {
            throw new Error(`خطأ (${response.status}): تأكد من صحة البيانات والصلاحيات.`);
          }
        }

        const data = await response.json();
        fileSha = data.sha;
        
        fileContent = decodeURIComponent(escape(window.atob(data.content)));

        // استخراج المندوبين
        const match = fileContent.match(/const salesTeam = (\[[\s\S]*?\]);/);
        if (match && match[1]) {
          currentTeam = (new Function('return ' + match[1]))();
          renderReps();
        }

        // استخراج رقم ميتا بكسل
        const pixelMatch = fileContent.match(/fbq\('init',\s*'([^']+)'\)/);
        if (pixelMatch && pixelMatch[1]) {
          currentPixelId = pixelMatch[1];
          document.getElementById('metaPixelId').value = currentPixelId;
        }

        document.getElementById('meta-settings').style.display = 'block';
        document.getElementById('btnAdd').style.display = 'block';
        document.getElementById('btnSave').style.display = 'block';
        
        showStatus('تم جلب البيانات بنجاح! يمكنك التعديل الآن.');
      } catch (err) {
        showStatus(err.message, true);
      } finally {
        document.getElementById('loading').style.display = 'none';
      }
    }

    function renderReps() {
      const container = document.getElementById('reps-container');
      container.innerHTML = '';
      
      currentTeam.forEach((rep, index) => {
        const card = document.createElement('div');
        card.className = 'rep-card';
        card.innerHTML = `
          <div>
            <label style="font-size: 12px; color: #718096;">الرابط (الآي دي)</label>
            <input type="text" value="${rep.id}" onchange="updateRep(${index}, 'id', this.value)" style="width: 100%">
          </div>
          <div>
            <label style="font-size: 12px; color: #718096;">اسم المندوب</label>
            <input type="text" value="${rep.name}" onchange="updateRep(${index}, 'name', this.value)" style="width: 100%">
          </div>
          <div>
            <label style="font-size: 12px; color: #718096;">الحرف (للدائرة)</label>
            <input type="text" value="${rep.initial}" onchange="updateRep(${index}, 'initial', this.value)" style="width: 100%">
          </div>
          <div class="full-row">
            <div style="flex: 1;">
              <label style="font-size: 12px; color: #718096;">رقم الجوال (بدون +)</label>
              <input type="text" value="${rep.phone}" onchange="updateRep(${index}, 'phone', this.value)" style="width: 100%">
            </div>
            <div style="flex: 1;">
              <label style="font-size: 12px; color: #718096;">المسمى الوظيفي</label>
              <input type="text" value="${rep.role}" onchange="updateRep(${index}, 'role', this.value)" style="width: 100%">
            </div>
            <button class="btn btn-delete" onclick="deleteRep(${index})" style="margin-top: 18px;">حذف</button>
          </div>
        `;
        container.appendChild(card);
      });
    }

    function updateRep(index, field, value) {
      currentTeam[index][field] = value;
    }

    function addRep() {
      currentTeam.push({
        id: "new",
        name: "مندوب جديد",
        role: "مستشار المبيعات",
        initial: "م",
        phone: "966500000000"
      });
      renderReps();
    }

    function deleteRep(index) {
      if (confirm('هل متأكد من الحذف؟')) {
        currentTeam.splice(index, 1);
        renderReps();
      }
    }

    async function saveToGithub() {
      const owner = document.getElementById('ghOwner').value.trim();
      const repo = document.getElementById('ghRepo').value.trim();
      const token = document.getElementById('ghToken').value.trim();
      const newPixelId = document.getElementById('metaPixelId').value.trim();

      if (!fileSha || !fileContent) {
        showStatus('الرجاء جلب البيانات أولاً.', true);
        return;
      }

      document.getElementById('loading').style.display = 'block';
      showStatus('جاري النشر، لا تقفل الصفحة...');

      try {
        let newFileContent = fileContent;

        // تحديث المبيعات
        const newJsonStr = JSON.stringify(currentTeam, null, 6);
        newFileContent = newFileContent.replace(/(const salesTeam = )\[[\s\S]*?\];/, `$1${newJsonStr};`);

        // تحديث الميتا بكسل في الكود
        if (newPixelId) {
          newFileContent = newFileContent.replace(/fbq\('init',\s*'[^']+'\)/g, `fbq('init', '${newPixelId}')`);
          newFileContent = newFileContent.replace(/id=[^&]+&ev=PageView/g, `id=${newPixelId}&ev=PageView`);
        }

        const base64Content = window.btoa(unescape(encodeURIComponent(newFileContent)));

        const response = await fetch(`https://api.github.com/repos/${owner}/${repo}/contents/index.html`, {
          method: 'PUT',
          headers: { 
            'Authorization': `token ${token}`,
            'Content-Type': 'application/json'
          },
          body: JSON.stringify({
            message: "تحديث من لوحة التحكم (المبيعات + ميتا بكسل)",
            content: base64Content,
            sha: fileSha
          })
        });

        if (!response.ok) throw new Error('فشل الحفظ.');

        const data = await response.json();
        fileSha = data.content.sha;
        fileContent = newFileContent;
        showStatus('✅ تم النشر فورا! سيظهر في موقعك خلال ثواني.');
      } catch (err) {
        showStatus(err.message, true);
      } finally {
        document.getElementById('loading').style.display = 'none';
      }
    }
  </script>
</body>
</html>
