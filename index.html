    :root {

      --radius-lg: 24px;
      --radius-md: 16px;
      --transition: all 0.3s ease;
      --max-w: 480px;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Tajawal', sans-serif;
      background: var(--bg-gradient);
      color: var(--text-main);

      display: flex;
      justify-content: center;
    }

    a { text-decoration: none; color: inherit; transition: var(--transition); }
    
    .container {
      width: 100%;
      max-width: var(--max-w);
      display: flex;
      flex-direction: column;
      gap: 24px;

    }

    h1 { font-size: 22px; font-weight: 800; margin-bottom: 8px; color: var(--text-main); }
    .subtitle { font-size: 14px; color: var(--text-muted); line-height: 1.6; }

    /* Sections */
    .section-title {
      font-size: 16px;
      font-weight: 800;
      margin-bottom: 16px;
      color: var(--primary);
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .section-title::before {
      content: "";
      display: block;
      width: 4px;
      height: 16px;
      background: var(--primary);
      border-radius: 4px;
    }

    /* Cards */
    .card-grid { display: flex; flex-direction: column; gap: 12px; }

    .contact-card {
      background: var(--surface);
      backdrop-filter: blur(10px);
      border: 1px solid var(--border);
      border-radius: var(--radius-md);
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 16px;
      box-shadow: var(--shadow-sm);
      transition: var(--transition);
    }

    .contact-card:hover { transform: translateY(-2px); box-shadow: var(--shadow-lg); background: var(--surface-solid); }

    .card-header { display: flex; align-items: center; gap: 12px; }

    .avatar {
      width: 48px;
      height: 48px;
      background: var(--primary);
      color: white;
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 18px;
      font-weight: 700;
    }

    .user-info h3 { font-size: 16px; font-weight: 700; margin-bottom: 4px; }
    .user-info p { font-size: 13px; color: var(--text-muted); font-weight: 500; }

    /* Buttons */
    .btn-group { display: grid; grid-template-columns: 2fr 1fr; gap: 8px; }

    .btn {
      padding: 12px;
      border-radius: 10px;
      font-size: 14px;
      font-weight: 700;
      text-align: center;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      border: none;
      cursor: pointer;
    }

    .btn-whatsapp { background: #25D366; color: white; box-shadow: 0 4px 12px rgba(37, 211, 102, 0.2); }
    .btn-whatsapp:hover { background: #20bd5a; transform: scale(1.02); }

    .btn-call { background: var(--accent); color: var(--text-main); }
    .btn-call:hover { background: #cbd5e1; }

    /* Social Grid */
    .social-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 12px;
    }

    .social-btn {
      background: var(--surface-solid);
      border: 1px solid var(--border);
      border-radius: var(--radius-md);
      padding: 16px 8px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 8px;
      font-size: 12px;
      font-weight: 700;
      color: var(--text-main);
      box-shadow: var(--shadow-sm);
    }

    .social-btn:hover { background: var(--primary); color: white; transform: translateY(-3px); }
    .social-btn svg { width: 24px; height: 24px; }

    /* Sticky Footer */
    .sticky-footer {
      position: fixed;
      bottom: 20px;
      left: 50%;
      transform: translateX(-50%);
      width: calc(100% - 32px);
      max-width: var(--max-w);
      background: rgba(255, 255, 255, 0.9);
      backdrop-filter: blur(12px);
      padding: 12px;
      border-radius: var(--radius-md);
      box-shadow: var(--shadow-lg);
      border: 1px solid var(--border);
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      z-index: 100;
    }

    .sticky-footer .btn { padding: 14px; }

    @media (max-width: 380px) {
      .social-grid { grid-template-columns: repeat(2, 1fr); }
      .btn-group { grid-template-columns: 1fr; }
    }

  <script>
    // ------------------------------------------------------------------
    // إدارة فريق المبيعات
    // يمكنك إضافة أو حذف الموظفين من هنا بكل سهولة
    // id: الكلمة التي ستكتب في الرابط (مثلاً omar)
    // name: اسم المندوب الذي سيظهر في الصفحة
    // phone: رقم الجوال مع رمز الدولة (بدون أصفار أو علامة +)
    // initial: الحرف الأول من الاسم الذي يظهر في الدائرة
    // ------------------------------------------------------------------
    const salesTeam = [
      {
            "id": "busultan",
            "name": "فريق المبيعات",
            "role": "مستشار المبيعات",
            "initial": "ع",
            "phone": "966548008247"
      },
      {
            "id": "buamer",
            "name": "فريق المبيعات",
            "role": "مستشار المبيعات",
            "initial": "ع",
            "phone": "966546101912"
      },
      {
            "id": "buabdullah",
            "name": "فريق المبيعات",
            "role": "مستشار المبيعات",
            "initial": "ع",
            "phone": "966542966582"
      },
      {
            "id": "omar",
            "name": "فريق المبيعات",
            "role": "مستشار المبيعات",
            "initial": "ع",
            "phone": "⁦96659929877⁩"
      }
];

    // قراءة رقم المندوب من الرابط (مثال: ?rep=omar)
    const urlParams = new URLSearchParams(window.location.search);
    const repId = urlParams.get('rep');

    const salesGrid = document.getElementById('sales-grid');
    const stickySalesBtn = document.getElementById('sticky-sales-btn');

    // تحديد المندوب الذي سيتم عرضه
    let repsToDisplay = salesTeam; // الافتراضي: عرض الجميع
    
    // إذا كان هناك اسم محدد في الرابط، ابحث عنه واعرضه فقط
    if (repId) {
      const specificRep = salesTeam.find(rep => rep.id.toLowerCase() === repId.toLowerCase());
      if (specificRep) {
        repsToDisplay = [specificRep];
      }
    }

    // بناء كروت المبيعات
    let cardsHtml = '';
    repsToDisplay.forEach(rep => {
      cardsHtml += `
        <div class="contact-card">
          <div class="card-header">
            <div class="avatar">${rep.initial}</div>
            <div class="user-info">
              <h3>${rep.name}</h3>
              <p>${rep.role}</p>
            </div>
          </div>
          <div class="btn-group">
            <a href="http://wa.me/${rep.phone}" class="btn btn-whatsapp" target="_blank" rel="noopener">واتساب</a>
            <a href="tel:+${rep.phone}" class="btn btn-call">اتصال</a>
          </div>
        </div>
      `;
    });
    
    salesGrid.innerHTML = cardsHtml;

    // تحديث الزر السفلي العائم ليتصل برقم أول مندوب معروض
    if (stickySalesBtn && repsToDisplay.length > 0) {
      stickySalesBtn.href = `http://wa.me/${repsToDisplay[0].phone}`;
    }
  </script>
